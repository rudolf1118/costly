name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push supersedes the previous run of the same event on the same
  # branch, which is cancelled. The event name is part of the key: with one
  # shared group, opening a pull request cancelled the branch's push run, and
  # GitHub showed that cancelled run as a failed check on every PR. A push to
  # a branch with an open PR therefore runs twice, about a minute each.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    # No service containers: the API integration tests use Testcontainers, which
    # starts its own PostgreSQL and Redis against the Docker daemon that GitHub's
    # Ubuntu runners already have running.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
